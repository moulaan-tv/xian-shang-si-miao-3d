name: Rename v44 temp file to index.html
on:
  push:
    paths:
      - '.github/workflows/rename-v44.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename temp file to index.html with git mv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls -l
          git mv xian-shang-si-miao-3d.html index.html
          git status
          git commit -m "v44 更新：以 git mv 將臨時檔案更名為 index.html"
          git push

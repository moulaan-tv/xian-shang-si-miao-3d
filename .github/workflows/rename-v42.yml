name: Rename v42 file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename v42 file to index.html
        run: |
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          ls -lh index.html
          git commit -m "v42 更新：打坐三蒲團隨機選、打坐釘住不被擠動、排隊依序推進、全部互動做完自動離開恢復操控"
          git push

name: tmp-upload

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download 0.11 asset from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p /tmp/dl
          if ! gh release download tmp-0.11-upload --pattern 'xian-shang-si-miao-3d.html' --dir /tmp/dl; then
            echo 'gh release download failed; falling back to API by release id'
            REL_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/tmp-0.11-upload" --jq '.id')
            ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${REL_ID}/assets" --jq '.[0].id')
            gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" -H 'Accept: application/octet-stream' > /tmp/dl/xian-shang-si-miao-3d.html
          fi
          EXPECTED=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/tmp-0.11-upload" --jq '.assets[0].size')
          ACTUAL=$(stat -c%s /tmp/dl/xian-shang-si-miao-3d.html)
          echo "expected bytes (API): ${EXPECTED}"
          echo "actual bytes: ${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo 'byte count mismatch'
            exit 1
          fi
          if [ "${ACTUAL}" != "34153093" ]; then
            echo 'byte count does not match 0.11 file (34153093)'
            exit 1
          fi
          cp /tmp/dl/xian-shang-si-miao-3d.html ./xian-shang-si-miao-3d.html
          git config user.name 'moulaan-tv'
          git config user.email 'moulaan-tv@users.noreply.github.com'
          git add xian-shang-si-miao-3d.html
          git commit -m 'Add 0.11 xian-shang-si-miao-3d.html'
          git push

permissions:
  contents: write
name: tmp-upload
on:
  workflow_dispatch:
jobs:
  tmp-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset and commit it as index.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          test -n "$GH_TOKEN"
          gh release download tmp-0.31-upload --pattern xian-shang-si-miao-3d.html --dir /tmp/dl
          ls -l /tmp/dl/xian-shang-si-miao-3d.html
          test "$(stat -c%s /tmp/dl/xian-shang-si-miao-3d.html)" = "48573657"
          cp /tmp/dl/xian-shang-si-miao-3d.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upload xian-shang-si-miao-3d.html v0.31 as index.html (48573657 bytes)"
          git push
          ls -l index.html

permissions:
  contents: write
name: tmp-upload
'on':
  workflow_dispatch: {}
jobs:
  tmp-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release asset, verify size and commit as index.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          test -n "$GH_TOKEN"
          gh release download tmp-0.31-hudfix --pattern xian-shang-si-miao-3d.html --dir /tmp/dl
          ls -l /tmp/dl/xian-shang-si-miao-3d.html
          test "$(stat -c%s /tmp/dl/xian-shang-si-miao-3d.html)" = "48577527"
          test "$(sha256sum /tmp/dl/xian-shang-si-miao-3d.html | cut -d ' ' -f1)" = "26da933b201d9e7749e02ecdfa7059e80fe5186ffc7292a86d9ad6b63d9b40c4"
          cp /tmp/dl/xian-shang-si-miao-3d.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upload xian-shang-si-miao-3d.html v0.31 HUD load-order fix as index.html (48577527 bytes)"
          git push
          ls -l index.html

name: tmp-upload
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download draft release asset and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="tmp-0.22-upload" and .draft==true) | .id' | head -n 1)
          echo "release id: $RELEASE_ID"
          test -n "$RELEASE_ID"
          mkdir -p /tmp/dl
          if ! gh release download tmp-0.22-upload --pattern "xian-shang-si-miao-3d.html" --dir /tmp/dl --clobber; then
            echo "gh release download failed, falling back to asset API by release id"
            ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="xian-shang-si-miao-3d.html") | .id' | head -n 1)
            echo "asset id: $ASSET_ID"
            test -n "$ASSET_ID"
            gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > /tmp/dl/xian-shang-si-miao-3d.html
          fi
          ls -l /tmp/dl/xian-shang-si-miao-3d.html
          BYTES=$(stat -c%s /tmp/dl/xian-shang-si-miao-3d.html)
          echo "bytes=$BYTES"
          test "$BYTES" = "36358348"
          echo "3d67b9aac5c9e7d9837324f5b442724a96fd792145e0fb1b68ae4a011a550337  /tmp/dl/xian-shang-si-miao-3d.html" | sha256sum -c -
          cp /tmp/dl/xian-shang-si-miao-3d.html ./xian-shang-si-miao-3d.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xian-shang-si-miao-3d.html
          git commit -m "Add 0.22 file from draft release tmp-0.22-upload" || echo "nothing to commit"
          git push

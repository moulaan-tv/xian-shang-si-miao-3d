permissions:
  contents: write
name: tmp-upload
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.16 file from draft release and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          RID=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name=="tmp-0.16-upload") | .id')
          echo "release_id=$RID"
          test -n "$RID"
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RID}/assets" --jq '.[].name'
          ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RID}/assets" --jq '.[] | select(.name=="xian-shang-si-miao-3d.html") | .id')
          echo "asset_id=$ASSET_ID"
          test -n "$ASSET_ID"
          if ! gh release download tmp-0.16-upload --pattern "xian-shang-si-miao-3d.html" --dir .; then
            echo "gh release download failed, falling back to asset download by release id"
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" -o xian-shang-si-miao-3d.html
          fi
          ls -l xian-shang-si-miao-3d.html
          SIZE=$(stat -c%s xian-shang-si-miao-3d.html)
          echo "size=$SIZE"
          test "$SIZE" = "34183683"
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git add xian-shang-si-miao-3d.html
          git commit -m "Add 0.16 file xian-shang-si-miao-3d.html"
          git push

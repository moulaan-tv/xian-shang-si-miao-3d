name: tmp-upload
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download draft release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download tmp-0.14-upload --pattern "xian-shang-si-miao-3d.html" --dir .
          ls -l xian-shang-si-miao-3d.html
      - name: Commit downloaded file
        run: |
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git add xian-shang-si-miao-3d.html
          git commit -m "Add 0.14 game file (tmp upload)" || echo "nothing to commit"
          git push
      - name: Verify size with GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ASSET_SIZE=$(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.tag_name=="tmp-0.14-upload") | .assets[] | select(.name=="xian-shang-si-miao-3d.html") | .size')
          echo "asset size: $ASSET_SIZE"
          COMMITTED_SIZE=$(gh api repos/${{ github.repository }}/contents/xian-shang-si-miao-3d.html --jq '.size')
          echo "committed size: $COMMITTED_SIZE"
          LOCAL_SIZE=$(stat -c%s xian-shang-si-miao-3d.html)
          echo "local size: $LOCAL_SIZE"
          test "$ASSET_SIZE" = "$COMMITTED_SIZE"
          test "$ASSET_SIZE" = "$LOCAL_SIZE"
          echo "SIZE MATCH: $ASSET_SIZE bytes"

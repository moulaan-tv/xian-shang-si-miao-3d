permissions:
  contents: write
name: tmp-upload
on:
  workflow_dispatch:
jobs:
  tmp-upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download draft release asset and commit it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          REL_ID=$(gh api "repos/${{ github.repository }}/releases" --jq '.[] | select(.tag_name == "tmp-0.29-upload") | .id' | head -n 1)
          echo "release id=$REL_ID"
          test -n "$REL_ID"
          ASSET_NAME=$(gh api "repos/${{ github.repository }}/releases/$REL_ID/assets" --jq '.[0].name')
          ASSET_URL=$(gh api "repos/${{ github.repository }}/releases/$REL_ID/assets" --jq '.[0].url')
          echo "asset=$ASSET_NAME url=$ASSET_URL"
          gh api -H "Accept: application/octet-stream" "$ASSET_URL" > "$ASSET_NAME"
          ls -l "$ASSET_NAME"
          BYTES=$(stat -c%s "$ASSET_NAME")
          echo "bytes=$BYTES"
          test "$BYTES" = "48537441"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$ASSET_NAME"
          git commit -m "Add xian-shang-si-miao-3d.html v0.29 (48537441 bytes)"
          git push
          ls -l "$ASSET_NAME"
          test "$(stat -c%s "$ASSET_NAME")" = "48537441"

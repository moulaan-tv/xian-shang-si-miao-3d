name: tmp-upload
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.18 file from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RID=$(gh api "repos/${{ github.repository }}/releases" --jq '.[] | select(.draft == true and .tag_name == "tmp-0.18-upload") | .id' | head -n 1)
          echo "draft release id: $RID"
          test -n "$RID"
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/$RID/assets" --jq '.[0].id')
          ASSET_NAME=$(gh api "repos/${{ github.repository }}/releases/$RID/assets" --jq '.[0].name')
          echo "asset: $ASSET_NAME ($ASSET_ID)"
          test -n "$ASSET_ID"
          if ! gh release download tmp-0.18-upload --pattern "$ASSET_NAME" --clobber; then
            echo "gh release download failed, falling back to releases/$RID/assets download"
            gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$ASSET_ID" > "$ASSET_NAME"
          fi
          ls -l "$ASSET_NAME"
          test "$(stat -c%s "$ASSET_NAME")" = "35998969"
          sha256sum "$ASSET_NAME"
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git add "$ASSET_NAME"
          git commit -m "tmp: add 0.18 file xian-shang-si-miao-3d.html"
          git push

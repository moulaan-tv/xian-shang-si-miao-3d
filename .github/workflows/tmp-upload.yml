permissions:
  contents: write
name: tmp-upload
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.15 file from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.tag_name == "tmp-0.15-upload") | .id' | head -n 1)
          echo "release_id=$RELEASE_ID"
          test -n "$RELEASE_ID"
          ASSET_ID=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[0].id')
          ASSET_NAME=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[0].name')
          echo "asset_id=$ASSET_ID asset_name=$ASSET_NAME"
          test -n "$ASSET_ID"
          gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${ASSET_ID}" > xian-shang-si-miao-3d.html
          ls -l xian-shang-si-miao-3d.html
          SIZE=$(wc -c < xian-shang-si-miao-3d.html)
          echo "size=$SIZE"
          test "$SIZE" = "34179732"
      - name: Commit file to repo root
        run: |
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git add xian-shang-si-miao-3d.html
          git commit -m "Add 0.15 file (tmp upload)"
          git push

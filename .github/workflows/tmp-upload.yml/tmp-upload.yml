name: tmp-upload
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          mkdir -p /tmp/dl
          if gh release download tmp-0.08-upload --pattern "xian-shang-si-miao-3d.html" --dir /tmp/dl; then
            echo "downloaded via gh"
          else
            echo "gh download failed, trying API"
            ASSET_URL=$(gh api repos/moulaan-tv/xian-shang-si-miao-3d/releases/tags/tmp-0.08-upload --jq '.assets[0].url')
            curl -L -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/octet-stream" -o /tmp/dl/xian-shang-si-miao-3d.html "$ASSET_URL"
          fi
          ls -l /tmp/dl
          cp /tmp/dl/xian-shang-si-miao-3d.html ./xian-shang-si-miao-3d.html
          ls -l xian-shang-si-miao-3d.html
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git add xian-shang-si-miao-3d.html
          git commit -m "0.08"
          git push

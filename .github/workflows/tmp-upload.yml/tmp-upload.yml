permissions:
  contents: write
name: tmp-upload-0.13
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download 0.13 asset from draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          EXPECTED=34162164
          FILE="xian-shang-si-miao-3d.html"
          rm -f "$FILE"
          if ! gh release download tmp-0.13-upload --pattern "$FILE" --dir .; then
            echo "gh release download failed, falling back to release-id lookup"
            RID=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == "tmp-0.13-upload") | .id' | head -n 1)
            echo "draft release id: $RID"
            test -n "$RID"
            ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/$RID/assets?per_page=100" --jq '.[] | select(.name == "xian-shang-si-miao-3d.html") | .id')
            ASSET_SIZE=$(gh api "repos/${{ github.repository }}/releases/$RID/assets?per_page=100" --jq '.[] | select(.name == "xian-shang-si-miao-3d.html") | .size')

            echo "asset id=$ASSET_ID size=$ASSET_SIZE"
            test "$ASSET_SIZE" = "$EXPECTED"
            gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$ASSET_ID" > "$FILE"
          fi
          RID=$(gh api "repos/${{ github.repository }}/releases?per_page=100" --jq '.[] | select(.draft == true and .tag_name == "tmp-0.13-upload") | .id' | head -n 1)
          echo "draft release id: $RID"
          API_SIZE=$(gh api "repos/${{ github.repository }}/releases/$RID/assets?per_page=100" --jq '.[] | select(.name == "xian-shang-si-miao-3d.html") | .size')
          echo "api asset size: $API_SIZE"
          ACTUAL=$(stat -c%s "$FILE")
          echo "downloaded bytes: $ACTUAL expected: $EXPECTED api: $API_SIZE"
          test "$ACTUAL" = "$EXPECTED"
          test "$API_SIZE" = "$EXPECTED"
          ls -l "$FILE"
      - name: Commit file to repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add xian-shang-si-miao-3d.html
          git status --short
          git commit -m "Add 0.13 xian-shang-si-miao-3d.html (34162164 bytes, verified)"
          git push

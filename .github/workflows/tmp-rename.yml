permissions:
  contents: write

name: tmp-rename

on:
  push:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename v110 file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          git commit -m "Rename v110 file to index.html"
          git push

name: tmp-rename

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename v94 file to index.html
        run: |
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          git commit -m "Rename v94 file to index.html"
          git push

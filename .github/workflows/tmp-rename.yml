name: Rename v105 to index.html

permissions:
  contents: write

on:
  push:
    paths:
      - .github/workflows/tmp-rename.yml

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          git mv xian-shang-si-miao-3d.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Rename v105 file to index.html"
          git push

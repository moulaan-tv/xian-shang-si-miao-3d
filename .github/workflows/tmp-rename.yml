name: tmp-rename
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename 0.18 file to index.html
        run: |
          set -euo pipefail
          ls -l xian-shang-si-miao-3d.html || true
          test -f xian-shang-si-miao-3d.html
          test "$(stat -c%s xian-shang-si-miao-3d.html)" = "35998969"
          sha256sum xian-shang-si-miao-3d.html
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          ls -l index.html
          test "$(stat -c%s index.html)" = "35998969"
          sha256sum index.html
          git commit -m "tmp: rename 0.18 file to index.html"
          git push

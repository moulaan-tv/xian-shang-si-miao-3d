name: tmp-rename

permissions:
  contents: write

on:
  workflow_dispatch:

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rename 0.11 file to index.html
        run: |
          set -euxo pipefail
          ls -l xian-shang-si-miao-3d.html
          test ! -e index.html
          git config user.name 'moulaan-tv'
          git config user.email 'moulaan-tv@users.noreply.github.com'
          git mv xian-shang-si-miao-3d.html index.html
          ls -l index.html
          git commit -m 'Rename 0.11 xian-shang-si-miao-3d.html to index.html'
          git push

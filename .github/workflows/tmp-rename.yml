permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename 0.17 file to index.html
        run: |
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          ls -l index.html
          sha256sum index.html
          git hash-object index.html
          git commit -m "Rename 0.17 file to index.html"
          git push

permissions:
  contents: write
name: tmp-rename-0.13
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename 0.13 file to index.html with git mv
        run: |
          set -euo pipefail
          ls -l
          test -f xian-shang-si-miao-3d.html
          test ! -e index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          test -f index.html
          test ! -e xian-shang-si-miao-3d.html
          ls -l index.html
          SIZE=$(stat -c%s index.html)
          echo "index.html bytes: $SIZE"
          test "$SIZE" = "34162164"
          git status --short
          git commit -m "Rename 0.13 xian-shang-si-miao-3d.html to index.html"
          git push

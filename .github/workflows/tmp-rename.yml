name: tmp-rename
permissions:
  contents: write
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Rename 0.22 file to index.html
        run: |
          set -euo pipefail
          ls -l xian-shang-si-miao-3d.html
          test ! -e index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          BYTES=$(stat -c%s index.html)
          echo "bytes=$BYTES"
          test "$BYTES" = "36358348"
          echo "3d67b9aac5c9e7d9837324f5b442724a96fd792145e0fb1b68ae4a011a550337  index.html" | sha256sum -c -
          git commit -m "Rename 0.22 file to index.html"
          git push

name: tmp-rename
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename temp file to index.html
        run: |
          git rm -f index.html || true
          git mv xian-shang-si-miao-3d.html index.html
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git commit -m "Rename v81 build to index.html"
          git push

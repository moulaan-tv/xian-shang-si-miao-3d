permissions:
  contents: write
name: tmp-rename
on:
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename 0.16 file to index.html
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ls -l
          test -f xian-shang-si-miao-3d.html
          test ! -e index.html
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          ls -l index.html
          test "$(stat -c%s index.html)" = "34183683"
          git commit -m "Rename 0.16 file to index.html"
          git push

name: Rename v41 file to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename v41 file to index.html
        run: |
          git config user.name "moulaan-tv"
          git config user.email "moulaan-tv@users.noreply.github.com"
          git mv xian-shang-si-miao-3d.html index.html
          git commit -m "v41 更新：水域堵塞修好、游船讓行 3.5 秒脫困、擺渡船讓行共用計時滿 4 秒半速通過、畫舫脫困逐級加碼封頂 2.8 米、渡船遇載客畫舫停船排隊最多等 6 秒"
          git push
